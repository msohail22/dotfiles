# Prefix
set -g prefix C-Space
set -g prefix2 C-a
unbind C-b
bind C-Space send-prefix
bind C-a send-prefix -2

# Reload config
bind q source-file ~/.config/tmux/tmux.conf \; display "Configuration reloaded"

# Vi mode for copy
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# Keyboard selection: `v` starts it, `V` takes whole lines, `C-v` makes a block.
# Moving the cursor alone selects nothing, so nothing is highlighted until one
# of these is pressed.
bind -T copy-mode-vi V send -X select-line
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi Escape send -X clear-selection

# Mouse selection: tmux's default MouseDragEnd1Pane runs
# copy-selection-and-cancel, which leaves copy mode the moment the button is
# released, so the highlight flashes and is gone. copy-pipe-no-clear copies to
# the clipboard and keeps both copy mode and the highlight on screen.
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-no-clear
bind -T copy-mode-vi DoubleClick1Pane send -X select-word \; send -X copy-pipe-no-clear
bind -T copy-mode-vi TripleClick1Pane send -X select-line \; send -X copy-pipe-no-clear

# tmux 3.8 gives copy mode, the tree chooser and menus their own *-style
# options. They default to "#{E:mode-style}", but only for the parts listed
# here; set each one so the amber block is the same everywhere and does not
# depend on the built-in theme.
set -g copy-mode-selection-style "bg=#D97706,fg=#121212,bold"
set -g copy-mode-position-style "bg=#D97706,fg=#121212"
set -g copy-mode-match-style "bg=#3F3F46,fg=#BEBEBE"
set -g copy-mode-current-match-style "bg=#D97706,fg=#121212,bold"
set -g copy-mode-current-line-style "bg=#1C1C1C"

# prefix + w (choose-tree). Its highlighted row is tree-mode-selection-style,
# NOT mode-style, which is why the selected session looked the same as the
# others. -Z zooms the chooser, -w opens it on the window list.
bind w choose-tree -Zw
set -g tree-mode-selection-style "bg=#D97706,fg=#121212,bold"
set -g menu-selected-style "bg=#D97706,fg=#121212,bold"
set -g menu-style "bg=#121212,fg=#BEBEBE"
set -g menu-border-style "fg=#D97706"

# Pane Controls
bind -n M-Enter split-window -v -c "#{pane_current_path}"
bind -n M-S-Enter split-window -h -c "#{pane_current_path}"
bind -n M-Escape kill-pane

bind - split-window -v -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"
bind x kill-pane

# Vim-style pane navigation (prefix + hjkl)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -n C-M-Left select-pane -L
bind -n C-M-Right select-pane -R
bind -n C-M-Up select-pane -U
bind -n C-M-Down select-pane -D

# Pane resize: prefix once (C-Space or C-a), then tap arrows. -r repeats.
bind -r Left  resize-pane -L 5
bind -r Down  resize-pane -D 5
bind -r Up    resize-pane -U 5
bind -r Right resize-pane -R 5

# Window navigation
bind r command-prompt -I "#W" "rename-window -- '%%'"
bind c new-window -c "#{pane_current_path}"
bind X kill-window

bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

bind -n M-Left select-window -t -1
bind -n M-Right select-window -t +1
bind -n M-S-Left swap-window -t -1 \; select-window -t -1
bind -n M-S-Right swap-window -t +1 \; select-window -t +1

# Session controls
bind R command-prompt -I "#S" "rename-session -- '%%'"
bind C new-session -c "#{pane_current_path}"
bind K kill-session
bind P switch-client -p
bind N switch-client -n

bind -n M-Up switch-client -p
bind -n M-Down switch-client -n

# General
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",*:RGB"
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -g focus-events on
set -g set-clipboard on
set -g allow-passthrough on
setw -g aggressive-resize on
set -g detach-on-destroy off
set -g extended-keys on
set -g extended-keys-format csi-u
set -ag terminal-features "xterm-kitty:extkeys"
set -sg escape-time 10

# Status bar
set -g status-position top
set -g status-interval 5
set -g status-left-length 30
set -g status-right-length 120
set -g window-status-separator " "
set -g status-justify centre
set -gw automatic-rename on
set -gw automatic-rename-format '#{b:pane_current_path}'
set -g set-titles on
set -g set-titles-string '#h:#W'

# Theme - matches the lualine statusline at the bottom of Neovim, so the two
# bars read as one system. Hex values come from matteblack/colors.lua:
#   amber #D97706 accent | fg2 #BEBEBE text | fg3 #8A8A8D dim | gray2 #737373
# bg stays "default" so the terminal background shows through.
#
# The window list is centred (status-justify above) because waybar already puts
# its Hyprland workspace tabs in the top-left corner; two tab strips stacked in
# the same corner read as duplicates.
set -g status-style "bg=default,fg=#BEBEBE"

# Session name in a filled block closed by a powerline arrow, the same shape
# lualine uses for its mode indicator.
set -g status-left "#[fg=#121212,bg=#D97706,bold] #S #[fg=#D97706,bg=default,nobold] "

# tmux ships window-status-current-style as "underscore", which draws a bare
# underline under the active tab. That underline is the ugly part: it ignores
# the theme and never lines up with the powerline block in status-left. Reset
# both styles explicitly so only the formats below decide how a tab looks.
set -g window-status-style "default"
set -g window-status-current-style "default"
set -g window-status-activity-style "default"

# Inactive tab: dim grey text, no background. The two leading and trailing
# spaces match the width the active tab spends on its powerline arrows, so a
# tab does not jump sideways when it becomes the active one.
set -g window-status-format "#[fg=#737373,bg=default]  #I #W  #[default]"

# Active tab: the same filled amber block as the session name on the left,
# closed by a powerline arrow on BOTH sides. The left arrow was missing, which
# left the block with one square edge and one rounded edge.
set -g window-status-current-format "#[fg=#D97706,bg=default]#[fg=#121212,bg=#D97706,bold] #I #W #[fg=#D97706,bg=default,nobold]#[default]"

# Prefix and mode flags, then git branch, battery and clock from the script.
set -g status-right "#[fg=#DC2626,bold]#{?pane_in_mode,COPY ,}#{?client_prefix,PREFIX ,}#{?window_zoomed_flag,ZOOM ,}#(~/.config/tmux/status-right.sh '#{pane_current_path}' '#{client_width}')"

set -g pane-border-style "fg=#262626"
set -g pane-active-border-style "fg=#D97706"
set -g message-style "bg=#D97706,fg=#121212,bold"
set -g message-command-style "bg=#D97706,fg=#121212,bold"
set -g mode-style "bg=#D97706,fg=#121212"
setw -g clock-mode-colour "#D97706"

# Plugins (TPM)
# prefix + Ctrl-s = save session | prefix + Ctrl-r = restore
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'

run '~/.tmux/plugins/tpm/tpm'

# Enable OSC 52 clipboard forwarding for remote Neovim yanks.
set -as terminal-features ",*:clipboard"

# Show line numbers in copy mode. "hybrid" = the cursor line shows its absolute
# number, every other line shows its distance from the cursor. The absolute
# number is what `:` (goto-line) takes. Present in tmux 3.7c.
setw -g copy-mode-line-numbers hybrid
