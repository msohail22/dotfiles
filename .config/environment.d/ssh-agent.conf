# Tell every program in the user session where the agent socket is.
#
# The service above already sets SSH_AUTH_SOCK for itself, but that value stops
# at the service. A shell, a terminal or an editor is a different process and
# would see nothing. Files in environment.d are read by the systemd user
# manager at login and applied to the whole session, which closes that gap.
#
# This is NOT a unit file, so systemd specifiers do not work here: %t stays the
# literal text "%t". environment.d does expand shell-style variables, so the
# runtime directory is written as $XDG_RUNTIME_DIR. It must match the socket
# path in systemd/user/ssh-agent.service exactly.
SSH_AUTH_SOCK=${XDG_RUNTIME_DIR}/ssh-agent.socket
