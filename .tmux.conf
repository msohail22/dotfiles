unbind C-b
set -g prefix C-a
bind C-a send-prefix

#Mouse support
set -g mouse on

#Window numbering starts at 1
set -g base-index 1
setw -g pane-base-index 1

#Larger scrollback
set -g history-limit 10000

#Vim pane navigation WITH prefix (Ctrl+a h/j/k/l)
bind h select-pane -L 
bind j select-pane -D 
bind k select-pane -U 
bind l select-pane -R

set -g mode-keys vi 

#### macOS clipboard integration
set-option -s set-clipboard on
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "pbcopy"

##### Status bar styling (Ayu Dark) #####
set -g status-bg "#0F1419"
set -g status-fg "#CBCCC6"
set -g status-left " #[fg=#5CCFE6,bold]#{session_name}#[fg=#CBCCC6] │ "
set -g status-left-length 30
set -g status-right "#[fg=#FFD580]%a %d %b#[fg=#CBCCC6] │ #[fg=#D4BFFF]%H:%M "
set -g status-right-length 40
set -g status-justify left

setw -g window-status-format "#[fg=#626A73] #{window_index}:#{window_name} "
setw -g window-status-current-format "#[fg=#5CCFE6,bold,bg=#1A1F29] #{window_index}:#{window_name} #[default]"

set -g message-style "bg=#1A1F29,fg=#5CCFE6"
set -g pane-border-style "fg=#3F454D"
set -g pane-active-border-style "fg=#5CCFE6"

